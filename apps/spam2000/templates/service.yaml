apiVersion: v1
kind: Service
metadata:
  name: spam2000
  labels:
    app: spam2000
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "{{ .Values.service.port }}"
    prometheus.io/path: "/metrics"
spec:
  selector:
    app: spam2000
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: 3000
  type: {{ .Values.service.type }}
