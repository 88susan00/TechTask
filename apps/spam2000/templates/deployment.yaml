apiVersion: apps/v1
kind: Deployment
metadata:
  name: spam2000
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: spam2000
  template:
    metadata:
      labels:
        app: spam2000
    spec:
      containers:
        - name: spam2000
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 3000

