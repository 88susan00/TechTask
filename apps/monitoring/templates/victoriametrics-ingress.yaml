{{- $vmValues := index .Values "victoria-metrics-single" }}
  {{- if $vmValues.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: victoriametrics-ingress
  namespace: monitoring
  labels:
    app: victoria-metrics-single
  {{- with $vmValues.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if $vmValues.ingress.className }}
  ingressClassName: {{ $vmValues.ingress.className }}
  {{- end }}
  {{- if $vmValues.ingress.tls }}
  tls:
    {{- range $vmValues.ingress.tls }}
    - hosts:
        {{- range .hosts }}
        - {{ . | quote }}
        {{- end }}
      secretName: {{ .secretName }}
    {{- end }}
  {{- end }}
  rules:
    {{- range $vmValues.ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          {{- range .paths }}
          - path: {{ .path }}
            pathType: {{ .pathType }}
            backend:
              service:
                name: monitoring-victoria-metrics-single-server
                port:
                  number: {{ $vmValues.ingress.servicePort | default 8428 }}
          {{- end }}
    {{- end }}
  {{- end }}
